<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Download latest APK</title>
    <meta name="description" content="Download the latest Android APK build." />
    <meta name="robots" content="noindex, nofollow" />
    <style>
      :root {
        color-scheme: light;
        --bg: #0d1117;
        --card: #161b22;
        --text: #f0f6fc;
        --muted: #8b949e;
        --line: #30363d;
        --accent: #2f81f7;
        --accent-hover: #1f6feb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: var(--text);
        background:
          radial-gradient(circle at 20% 10%, rgba(47, 129, 247, 0.28), transparent 34rem),
          radial-gradient(circle at 80% 90%, rgba(63, 185, 80, 0.18), transparent 28rem),
          var(--bg);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(100%, 460px);
        padding: clamp(28px, 8vw, 48px);
        border: 1px solid var(--line);
        border-radius: 24px;
        background: rgba(22, 27, 34, 0.9);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.38);
        text-align: center;
      }

      h1 {
        margin: 0 0 14px;
        font-size: clamp(2rem, 8vw, 3.6rem);
        line-height: 1.02;
        letter-spacing: -0.06em;
      }

      .version {
        margin: 0 0 28px;
        color: var(--muted);
        font-size: 1rem;
      }

      .download {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 56px;
        padding: 14px 20px;
        border-radius: 999px;
        color: #fff;
        background: var(--accent);
        font-size: 1.05rem;
        font-weight: 700;
        text-decoration: none;
      }

      .download:hover,
      .download:focus-visible {
        background: var(--accent-hover);
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="download-title">
      <h1 id="download-title">Download latest APK</h1>
      <p class="version">Version: 2026-06-08 10:30</p>
      <a class="download" href="/latest.apk" download>Download latest APK</a>
    </main>
  </body>
</html>
