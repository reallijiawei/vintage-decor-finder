<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Download latest APK</title>
    <meta name="robots" content="noindex, nofollow" />
    <style>
      :root {
        --bg: #0d1117;
        --card: #161b22;
        --text: #f0f6fc;
        --muted: #8b949e;
        --accent: #2f81f7;
        --accent-hover: #1f6feb;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: var(--text);
        background: var(--bg);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(100%, 360px);
        padding: 32px;
        border-radius: 20px;
        background: var(--card);
        text-align: center;
      }

      .download {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 56px;
        border-radius: 999px;
        color: #fff;
        background: var(--accent);
        font-size: 1.08rem;
        font-weight: 700;
        text-decoration: none;
      }

      .download:hover,
      .download:focus-visible { background: var(--accent-hover); }

      .uploaded-at {
        margin: 18px 0 0;
        color: var(--muted);
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <main>
      <a class="download" href="/latest.apk" download>Download latest APK</a>
      <p class="uploaded-at">Uploaded: 2026-06-08 16:52:11</p>
    </main>
  </body>
</html>
